server:
  port: 8080

spring:
  application:
    name: integration-lab
  kafka:
    bootstrap-servers: localhost:9094
    admin:
      fail-fast: false
    listener:
      missing-topics-fatal: false
    consumer:
      group-id: integration-lab-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/integration_lab
    username: integration_lab
    password: integration_lab
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  kafka:
    topic: practice-messages
  redis:
    message-ttl: 300s
    generated-key-prefix: generated
    generated-message-prefix: Generated redis message
  memory:
    max-mb: 4098
  cpu:
    max-seconds: 60
    max-threads: 8
  queue:
    drain:
      fixed-delay-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true


