services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: integration-lab-kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Internal listener for Docker network + external listener for host access
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://kafka:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_CLUSTER_ID=2Hkv1Mk1SCOxTGUfOh3cfw
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: integration-lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:10.4.5
    container_name: integration-lab-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
  redis:
    image: redis:7.2-alpine
    container_name: integration-lab-redis
    ports:
      - "6379:6379"
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: integration-lab-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
  postgres:
    image: postgres:16-alpine
    container_name: integration-lab-postgres
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=500"
    environment:
      - POSTGRES_DB=integration_lab
      - POSTGRES_USER=integration_lab
      - POSTGRES_PASSWORD=integration_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: integration-lab-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://integration_lab:integration_lab@postgres:5432/integration_lab?sslmode=disable
    depends_on:
      - postgres
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: integration-lab-kafka-exporter
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
    depends_on:
      - kafka

volumes:
  kafka_data:
  prometheus_data:
  grafana_data:
  postgres_data:
